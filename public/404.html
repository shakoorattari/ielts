<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — IELTS Band Builder</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="https://shakoorattari.com/ielts/favicon.svg" />
    <style>
      :root {
        --bg: #f7f6f3;
        --ink: #1b1a22;
        --soft: #625f6e;
        --brand: #6d4fd6;
        --on-brand: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131218;
          --ink: #f1eff8;
          --soft: #a29dae;
          --brand: #9683e8;
          --on-brand: #131218;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
      }
      p {
        margin: 0.5rem 0;
        color: var(--soft);
      }
      a.button {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.65rem 1.25rem;
        border-radius: 0.6rem;
        background: var(--brand);
        color: var(--on-brand);
        font-weight: 600;
        text-decoration: none;
      }
      a.text {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>That address doesn’t exist in IELTS Band Builder.</p>
      <a class="button" href="https://shakoorattari.com/ielts/">Open the app</a>
      <p><a class="text" href="https://shakoorattari.com/">Back to shakoorattari.com</a></p>
    </main>
  </body>
</html>
